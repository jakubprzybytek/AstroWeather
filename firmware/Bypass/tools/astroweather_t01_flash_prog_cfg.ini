; AstroWeather flash configuration for the MissionT01 profile.
;
; Identical to the vendor's mission_t01_flash_prog_cfg.ini except that the
; LittleFS partition comes from tools/littlefs/littlefs.bin (built by
; Build-LittleFS.sh), which holds only the CA the HostController trusts.
; Paths are resolved by Program-ST67.sh relative to this file; the FW line is
; replaced with the selected image and must keep the vendor's form.
;
;   ./Build-LittleFS.sh
;   ./Program-ST67.sh --port COMx --profile MissionT01 \
;       --config-path tools/astroweather_t01_flash_prog_cfg.ini --force

[cfg]
erase = 2
skip_mode = 0x0, 0x0
boot2_isp_mode = 0

[boot2]
filedir = ../External/x-cube-st67w61/Projects/ST67W6X_Scripts/Binaries/NCP_Binaries/st67w611m_boot2_v8.1.9.bin
address = 0x000000

[partition]
filedir = ../External/x-cube-st67w61/Projects/ST67W6X_Scripts/Binaries/NCP_Binaries/partition.bin
address = 0xE000

[littlefs]
filedir = ./littlefs/littlefs.bin
address = 0x378000

[FW]
filedir = ./st67w611m_mission_t01_vxxx.bin
address = @partition
