name: Deploy SST

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sst-int
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sst
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sst/package-lock.json
            sst/packages/web/package-lock.json

      # The web UI has its own lockfile; the deploy builds it.
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix packages/web

      - name: Run unit and web tests
        run: |
          npm run test
          npm run test:web

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Deploy SST stage
        run: npm run deploy -- --stage int
