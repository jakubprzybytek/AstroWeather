name: Deploy SST

on:
  push:
    branches: [main]
    paths:
      - 'sst/**'
      - '.github/workflows/deploy-sst.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sst-int
  cancel-in-progress: false # a cancelled SST deploy leaves the stage locked

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC → AWS (agent-playbook/aws-github-deploy)
    defaults:
      run:
        working-directory: sst
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sst/package-lock.json
            sst/packages/web/package-lock.json

      # The web UI has its own lockfile; the deploy builds it.
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix packages/web

      - name: Run unit and web tests
        run: |
          npm run test
          npm run test:web

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHub-AstroWeather
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gh-astroweather-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Deploy SST stage
        run: npm run deploy -- --stage int
